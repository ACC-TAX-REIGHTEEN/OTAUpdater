[SETTINGS]
# URL langsung ke file main.zip di GitHub (Raw URL atau Releases Download URL)
zip_url = https://raw.githubusercontent.com/ACC-TAX-REIGHTEEN/Automasi-AR-Orderan/main/Dapur/OTA/main.zip

# Opsional: URL file teks berisi hash SHA-256 dari main.zip untuk pengecekan instan (<0.1 detik).
# Kosongkan jika ingin langsung mengunduh/mengecek main.zip.
hash_url = https://raw.githubusercontent.com/ACC-TAX-REIGHTEEN/Automasi-AR-Orderan/main/Dapur/OTA/main.sha256

# Batas waktu tunggu jaringan dalam detik
timeout = 20

# Nama file Orchestrator utama di luar folder Dapur (Project Root)
orchestrator_script = MainOrchestrator.py

[PIP]
# Paket wajib: otomatis di-install jika di PC Depo belum terpasang
packages = python-calamine, openpyxl

# Upgrade dinamis: cukup tambahkan 'upgrade_<nama_paket> = Ya'
# Akan dieksekusi dengan 'python -m pip install --upgrade <nama_paket>' saat ada rilis OTA baru
upgrade_pip = Ya
upgrade_pandas = Tidak
upgrade_python-calamine = Ya

# Alternatif daftar paket yang ingin di-upgrade sekaligus (dipisahkan koma)
upgrade_packages = 

[PROTECT]
# File lokal yang TIDAK BOLEH ditimpa jika sudah ada di PC Depo (dipisahkan koma)
files = credentials.json

[BACKUP]
# File lokal yang akan dicadangkan menjadi '.bak' sebelum ditimpa versi baru (dipisahkan koma)
files = helper.txt

[DELETE]
# File usang yang akan dihapus otomatis dari Dapur atau Root (relatif terhadap Root atau Dapur, dipisahkan koma)
files = 1.py, 2.py, 3.py, 4.py

[MERGE_CONF]
# File konfigurasi yang digabungkan baris demi baris (data lokal aman, baris baru disisipkan sesuai urutan, dipisahkan koma)
files = config.conf, piutang.conf
